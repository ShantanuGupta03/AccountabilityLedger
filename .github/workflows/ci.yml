name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate case data
        run: python3 scripts/validate_cases.py

      - name: Check source links
        run: node scripts/check_links.mjs

      - name: Build site
        run: npm run build
